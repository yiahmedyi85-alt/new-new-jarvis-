name = "jarvis-cloud"
main = "src/index.ts"
compatibility_date = "2026-11-10"

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "jarvis-cloud-files"

[[d1_databases]]
binding = "DB"
database_name = "jarvis-db"
database_id = "31a4a09f-e185-4c33-9523-b250d7951848"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
