name = "jarvis-cloud"
main = "src/index.ts"
compatibility_date = "2026-11-10"

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "jarvis-cloud-files"

[[d1_databases]]
binding = "DB"
database_name = "jarvis-cloud-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
